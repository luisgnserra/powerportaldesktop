name: Validate distribution files
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check distribution allowlist, script syntax and release checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            '.gitattributes', '.gitignore', 'README.md', 'CHANGELOG.md',
            'DISTRIBUTION.md', 'SHA256SUMS.txt', 'release.json', 'install.ps1',
            'docs/INSTALLATION.md', 'docs/CONFIGURATION.md', 'docs/USAGE.md',
            'docs/TROUBLESHOOTING.md', '.github/ISSUE_TEMPLATE/config.yml',
            '.github/ISSUE_TEMPLATE/installation.yml', '.github/workflows/distribution-check.yml',
            'docs/SCREENSHOTS.md', 'docs/RELEASING.md', 'docs/UPDATES.md', 'docs/RELATIONSHIPS.md', 'docs/REFRESH-ANALYSIS.md',
            'docs/images/powerbi-external-tools.png', 'docs/images/home.png', 'docs/images/home-hover.png',
            'docs/images/connect-open-model.png', 'docs/images/live-model-data.png',
            'docs/images/theme-generator.png', 'docs/images/theme-send.png', 'docs/images/calendar-generator.png',
            'docs/images/components.png', 'docs/images/dax-formatter.png',
            'docs/images/tv-tool.png', 'docs/images/performance-checklist.png',
            'docs/images/contrast-calculator.png', 'docs/images/project-analyzer.png',
            'docs/images/model-documenter.png', 'docs/images/measure-auditor.png',
            'docs/images/consulting-training.png', 'docs/images/collapsed-sidebar.png',
            'docs/images/update-available.png', 'docs/images/relationship-map.png', 'docs/images/relationship-editor.png',
            'docs/images/relationship-groups.png', 'docs/images/relationship-create.png', 'docs/images/refresh-analysis.png',
            'docs/images/refresh-progress.png'
            'docs/images/improvement-ideas.png'
          )
          $locales = @('pt-BR', 'es', 'zh-CN', 'fr', 'ja', 'hi', 'ar')
          $guides = @('INSTALLATION', 'CONFIGURATION', 'USAGE', 'TROUBLESHOOTING', 'SCREENSHOTS', 'RELEASING', 'UPDATES', 'RELATIONSHIPS', 'REFRESH-ANALYSIS')
          $applicationImages = @($allowed | Where-Object { $_ -like 'docs/images/*.png' -and $_ -ne 'docs/images/powerbi-external-tools.png' })
          foreach ($locale in $locales) {
            foreach ($name in @('README', 'CHANGELOG', 'DISTRIBUTION')) { $allowed += "$name.$locale.md" }
            foreach ($guide in $guides) { $allowed += "docs/$locale/$guide.md" }
            foreach ($image in $applicationImages) { $allowed += "docs/images/$locale/$([IO.Path]::GetFileName($image))" }
          }
          $tracked = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect tracked files.' }
          foreach ($file in $tracked) {
            if ($file -notin $allowed) { throw "Non-distribution file: $file" }
          }
          foreach ($file in $allowed) {
            if ($file -notin $tracked) { throw "Missing distribution file: $file" }
          }
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          if ($release.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          if ($release.tag -ne "v$($release.version)") { throw 'Release tag/version mismatch.' }
          if ($release.sha256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid checksum.' }
          if ($release.installer -ne "PowerPortal-Setup-$($release.version)-x64.exe") { throw 'Invalid asset filename.' }
          $expectedUrl = "https://github.com/luisgnserra/powerportaldesktop/releases/download/v$($release.version)/$($release.installer)"
          if ($release.downloadUrl -ne $expectedUrl) { throw 'Unexpected download URL.' }
          $sum = (Get-Content SHA256SUMS.txt -Raw).Trim() -split '\s+'
          if ($sum.Count -ne 2 -or $sum[0] -ne $release.sha256 -or $sum[1] -ne $release.installer) {
            throw 'Release manifest/checksum mismatch.'
          }
          $helper = Get-Content install.ps1 -Raw
          if (-not $helper.Contains($release.sha256.ToUpperInvariant())) { throw 'Helper checksum mismatch.' }
          if (-not $helper.Contains("`$version = '$($release.version)'")) { throw 'Helper version mismatch.' }
          if ($release.screenshotsVersion -ne $release.version) { throw 'Screenshot version is outdated.' }
          $screenshots = Get-Content docs/SCREENSHOTS.md -Raw
          if (-not $screenshots.Contains("Power Portal Desktop $($release.version)")) { throw 'Screenshot guide version mismatch.' }
          foreach ($file in $allowed | Where-Object { $_ -like '*.png' }) {
            $signature = [IO.File]::ReadAllBytes((Join-Path $PWD $file))
            if ($signature.Length -lt 8 -or [BitConverter]::ToString($signature[0..7]) -ne '89-50-4E-47-0D-0A-1A-0A') {
              throw "Invalid screenshot PNG: $file"
            }
          }
          function Get-DocumentText($file) {
            return [IO.File]::ReadAllText((Join-Path $PWD ($file -replace '/', '\')))
          }
          function Get-Prose($text) {
            return [regex]::Replace($text, '(?ms)^```[^\r\n]*\r?\n.*?^```[ \t]*\r?$', '')
          }
          foreach ($file in $allowed | Where-Object { $_ -like '*.md' }) {
            $text = Get-DocumentText $file
            $selector = [regex]::Match($text, '(?s)<!-- language-selector -->(.*?)<!-- /language-selector -->')
            if (-not $selector.Success -or [regex]::Matches($selector.Groups[1].Value, '\]\(').Count -ne 8) {
              throw "Missing eight-language selector: $file"
            }
            $prose = Get-Prose $text
            foreach ($match in [regex]::Matches($prose, '\]\(([^)]+)\)')) {
              $link = $match.Groups[1].Value
              if ($link -match '^[a-zA-Z][a-zA-Z0-9+.-]*:') { continue }
              $parts = $link -split '#', 2
              $source = Join-Path $PWD ($file -replace '/', '\')
              $target = $source
              if ($parts[0]) { $target = Join-Path (Split-Path $source) ($parts[0] -replace '/', '\') }
              if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Broken link in ${file}: $link" }
              if ($parts.Count -gt 1 -and $parts[1] -and $target -like '*.md') {
                $targetText = Get-Prose ([IO.File]::ReadAllText($target))
                $anchors = @([regex]::Matches($targetText, '(?m)^#{1,6}\s+(.+?)\r?$') | ForEach-Object {
                  $_.Groups[1].Value.ToLowerInvariant() -replace '[^\p{L}\p{N}_\s-]', '' -replace '\s', '-'
                })
                $anchors += @([regex]::Matches($targetText, '<a\s+(?:name|id)="([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
                if ([Uri]::UnescapeDataString($parts[1]) -notin $anchors) { throw "Broken heading link in ${file}: $link" }
              }
            }
          }
          foreach ($locale in $locales) {
            foreach ($name in @('README', 'CHANGELOG', 'DISTRIBUTION') + $guides) {
              $english = "$name.md"
              $localized = "$name.$locale.md"
              if ($name -in $guides) { $english = "docs/$name.md"; $localized = "docs/$locale/$name.md" }
              $source = Get-DocumentText $english
              $translation = Get-DocumentText $localized
              $sourceCode = @([regex]::Matches($source, '(?ms)^```[^\r\n]*\r?\n.*?^```[ \t]*\r?$') | ForEach-Object { $_.Value -replace "`r", '' })
              $translatedCode = @([regex]::Matches($translation, '(?ms)^```[^\r\n]*\r?\n.*?^```[ \t]*\r?$') | ForEach-Object { $_.Value -replace "`r", '' })
              if (($sourceCode -join "`n") -cne ($translatedCode -join "`n")) { throw "Translated executable example differs: $localized" }
              $sourceHeadings = [regex]::Matches((Get-Prose $source), '(?m)^#{1,6}\s+').Count
              $translatedHeadings = [regex]::Matches((Get-Prose $translation), '(?m)^#{1,6}\s+').Count
              if ($sourceHeadings -ne $translatedHeadings) { throw "Missing translated sections: $localized" }
              foreach ($pattern in @('(?m)^\s*(?:[-*]|\d+\.)\s+', '(?m)^\|.*\|\s*$', '!\[[^\]]*\]\([^)]+\)')) {
                if ([regex]::Matches((Get-Prose $source), $pattern).Count -ne [regex]::Matches((Get-Prose $translation), $pattern).Count) {
                  throw "Missing translated lists, table rows or illustrations: $localized"
                }
              }
              foreach ($imageMatch in [regex]::Matches($translation, '!\[[^\]]*\]\(([^)]+)\)')) {
                $imageLink = $imageMatch.Groups[1].Value
                $imageName = [IO.Path]::GetFileName($imageLink)
                $expectedImage = "docs\images\$locale\$imageName"
                if ($imageName -eq 'powerbi-external-tools.png') { $expectedImage = "docs\images\$imageName" }
                $documentPath = Join-Path $PWD ($localized -replace '/', '\')
                $imagePath = [IO.Path]::GetFullPath((Join-Path (Split-Path $documentPath) ($imageLink -replace '/', '\')))
                if ($imagePath -ne (Join-Path $PWD $expectedImage)) { throw "Wrong screenshot language: $localized -> $imageLink" }
              }
              if ($name -eq 'SCREENSHOTS' -and -not $translation.Contains("Power Portal Desktop $($release.version)")) { throw "Outdated localized screenshots: $localized" }
            }
          }
          Write-Host 'Distribution-only files, eight-language documentation, links, executable examples, PNGs and release metadata validated. No installer was run.'
