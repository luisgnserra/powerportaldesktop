name: Validate distribution files
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check distribution allowlist, script syntax and release checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $allowed = @(
            '.gitattributes', '.gitignore', 'README.md', 'CHANGELOG.md',
            'DISTRIBUTION.md', 'SHA256SUMS.txt', 'release.json', 'install.ps1',
            'docs/INSTALLATION.md', 'docs/CONFIGURATION.md', 'docs/USAGE.md',
            'docs/TROUBLESHOOTING.md', '.github/ISSUE_TEMPLATE/config.yml',
            '.github/ISSUE_TEMPLATE/installation.yml', '.github/workflows/distribution-check.yml'
          )
          $tracked = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect tracked files.' }
          foreach ($file in $tracked) {
            if ($file -notin $allowed) { throw "Non-distribution file: $file" }
          }
          foreach ($file in $allowed) {
            if ($file -notin $tracked) { throw "Missing distribution file: $file" }
          }
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          if ($release.version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version.' }
          if ($release.sha256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid checksum.' }
          if ($release.installer -ne "PowerPortal-Setup-$($release.version)-x64.exe") { throw 'Invalid asset filename.' }
          $expectedUrl = "https://github.com/luisgnserra/powerportaldesktop/releases/download/v$($release.version)/$($release.installer)"
          if ($release.downloadUrl -ne $expectedUrl) { throw 'Unexpected download URL.' }
          $sum = (Get-Content SHA256SUMS.txt -Raw).Trim() -split '\s+'
          if ($sum.Count -ne 2 -or $sum[0] -ne $release.sha256 -or $sum[1] -ne $release.installer) {
            throw 'Release manifest/checksum mismatch.'
          }
          $helper = Get-Content install.ps1 -Raw
          if (-not $helper.Contains($release.sha256.ToUpperInvariant())) { throw 'Helper checksum mismatch.' }
          if (-not $helper.Contains("`$version = '$($release.version)'")) { throw 'Helper version mismatch.' }
          Write-Host 'Distribution-only files, PowerShell syntax and release metadata validated. No installer was run.'
